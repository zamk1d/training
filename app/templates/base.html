<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sport Tracker{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <script>
        // Применяем тему ДО рендера, чтобы не было мигания
        (function () {
            var saved = localStorage.getItem('theme');
            var theme = saved || (
                window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                    ? 'dark' : 'light'
            );
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
</head>
<body>
    <header class="topbar">
        <a href="/" class="logo">💪 Sport Tracker</a>
        <nav>
            <a href="/">Дашборд</a>
            <a href="/import">Импорт JSON</a>
        </nav>
        <button class="theme-toggle" id="theme-toggle" title="Переключить тему" aria-label="Переключить тему">
            <span class="theme-icon">🌙</span>
        </button>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <script src="/static/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
